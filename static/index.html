<!doctype html><html lang="de" data-theme="hell" data-size="m"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" id="themeColor" content="#ffffff"><title>hAI.News</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head><body><header><a class="brand" href="/">hAI<span>.News</span></a><select id="theme" aria-label="Design"><option value="auto">Auto</option><option value="hell">Hell</option><option value="dunkel">Dunkel</option><option value="schwarz">Schwarz</option><option value="sepia">Sepia</option></select><button id="adminBtn" aria-label="Verwaltung">⚙</button></header><nav id="categories" aria-label="Themen"></nav><main><p id="status" aria-live="polite">Nachrichten werden geladen …</p><div class="filters"><input id="search" type="search" placeholder="Suchen …" aria-label="Suche"><select id="source" aria-label="Quelle"><option value="">Alle Quellen</option></select></div><section id="news" class="grid" aria-live="polite"></section><button id="more" hidden>Mehr Nachrichten</button><p id="error" role="alert"></p><footer>hAI.News · RSS-Übersicht · Artikel öffnen beim jeweiligen Verlag</footer></main><dialog id="reader"><div class="bar"><button id="smaller" aria-label="Schrift kleiner">A−</button><button id="bigger" aria-label="Schrift größer">A+</button><button id="readerClose">Schließen</button></div><small id="readerMeta"></small><h2 id="readerTitle"></h2><div id="readerImg"></div><div id="readerBody"></div><p id="readerNote"></p><a id="readerLink" class="btn" target="_blank" rel="noopener noreferrer">Beim Verlag lesen</a></dialog><dialog id="admin"><div class="bar"><button id="close">Schließen</button></div><h2>Verwaltung</h2><form id="login"><label>Admin-Passwort<input id="password" type="password" autocomplete="current-password" required></label><button>Anmelden</button></form><section id="controls" hidden><form id="settings"><label>Abrufintervall in Minuten<input id="interval" type="number" min="5" max="1440" required></label><button>Speichern</button></form><button id="refresh">Jetzt abrufen</button><h3>RSS / Atom hinzufügen</h3><form id="add"><input name="name" placeholder="Quellenname" aria-label="Quellenname" required><input name="url" type="url" placeholder="https://…/feed.xml" aria-label="Feed URL" required><input name="category" placeholder="Kategorie" aria-label="Kategorie" value="Nachrichten" required><button type="button" id="testFeed">Feed testen</button><button>Feed hinzufügen</button></form><p id="adminInfo"></p><h3>Quellen und Abrufstatus</h3><div id="feedlist"></div><button id="logout">Abmelden</button></section><p id="adminError" role="alert"></p></dialog></body></html>
