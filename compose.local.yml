services:
  news:
    build: .
    restart: unless-stopped
    ports: ["${NEWS_PORT:-8666}:8080"]
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Passwort setzen}
      SECRET_KEY: ${SECRET_KEY:?Secret setzen}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes: ["news_data:/data"]
volumes:
  news_data:
